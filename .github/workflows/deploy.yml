name: build-and-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: league-akari-production
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ${{ vars.ALIYUN_REGISTRY }}/${{ vars.ALIYUN_NAMESPACE }}/${{ vars.IMAGE_NAME }}

jobs:
  build-and-push:
    name: 构建并推送 amd64 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 打包应用（跳过测试，CI 无法访问本地 MySQL）
        run: mvn -B package -DskipTests

      - name: 计算镜像版本
        id: version
        shell: bash
        run: echo "image_tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: 登录阿里云容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.image_tag }}
            ${{ env.IMAGE_REPOSITORY }}:latest

  deploy:
    name: 部署到生产云服务器
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, league-akari-prod]
    permissions:
      contents: read
    steps:
      - name: 检出本次提交
        uses: actions/checkout@v4

      - name: 同步仓库配置到固定目录
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 755 /opt/league-akari/repo /opt/league-akari/config
          test -f /opt/league-akari/config/.env
          rm -rf /opt/league-akari/repo
          install -d -m 755 /opt/league-akari/repo
          tar --exclude='.git' --exclude='.env' -C "${GITHUB_WORKSPACE}" -cf - . \
            | tar -C /opt/league-akari/repo -xf -

      - name: 登录阿里云容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 拉取并部署指定 SHA 镜像
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -Eeuo pipefail
          cd /opt/league-akari/repo
          IMAGE_REPOSITORY="${IMAGE_REPOSITORY}" IMAGE_TAG="${IMAGE_TAG}" ./deploy.sh

      - name: 注销镜像仓库
        if: always()
        run: docker logout "${{ vars.ALIYUN_REGISTRY }}"
