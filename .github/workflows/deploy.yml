name: build-and-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: league-akari-production
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ${{ vars.ALIYUN_REGISTRY }}/${{ vars.ALIYUN_NAMESPACE }}/${{ vars.IMAGE_NAME }}

jobs:
  build-and-push:
    name: 构建并推送 amd64 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查 GitHub Actions 配置
        env:
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "${ALIYUN_REGISTRY}" || { echo "❌ 缺少 Variable: ALIYUN_REGISTRY（阿里云镜像仓库域名）"; exit 1; }
          test -n "${ALIYUN_NAMESPACE}" || { echo "❌ 缺少 Variable: ALIYUN_NAMESPACE（阿里云命名空间）"; exit 1; }
          test -n "${IMAGE_NAME}" || { echo "❌ 缺少 Variable: IMAGE_NAME（镜像仓库名）"; exit 1; }
          test -n "${ALIYUN_USERNAME}" || { echo "❌ 缺少 Secret: ALIYUN_USERNAME"; exit 1; }
          test -n "${ALIYUN_PASSWORD}" || { echo "❌ 缺少 Secret: ALIYUN_PASSWORD"; exit 1; }
          echo "✓ 配置完整，镜像地址：${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${IMAGE_NAME}"

      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 打包应用（跳过测试，CI 无法访问本地 MySQL）
        run: mvn -B package -DskipTests

      - name: 计算镜像版本
        id: version
        shell: bash
        run: echo "image_tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: 登录阿里云容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.image_tag }}
            ${{ env.IMAGE_REPOSITORY }}:latest

  deploy:
    name: 通过 SSH 部署到云服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出本次提交
        uses: actions/checkout@v4

      - name: 上传代码到云服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: "/tmp/league-akari-deploy"

      - name: 在云服务器执行部署
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_REPOSITORY,IMAGE_TAG,ALIYUN_REGISTRY,ALIYUN_USERNAME,ALIYUN_PASSWORD
          script: |
            set -Eeuo pipefail
            sudo mkdir -p /opt/league-akari/repo /opt/league-akari/config
            sudo chown "$USER":"$USER" /opt/league-akari
            test -f /opt/league-akari/config/.env || { echo "❌ 缺少 /opt/league-akari/config/.env，请先创建"; exit 1; }
            rm -rf /opt/league-akari/repo
            mkdir -p /opt/league-akari/repo
            cp -a /tmp/league-akari-deploy/. /opt/league-akari/repo/
            rm -rf /tmp/league-akari-deploy
            docker login "${ALIYUN_REGISTRY}" -u "${ALIYUN_USERNAME}" -p "${ALIYUN_PASSWORD}"
            cd /opt/league-akari/repo
            chmod +x deploy.sh
            ./deploy.sh