server:
  port: 8081
  # 本地默认仅监听回环地址，容器生产环境通过 SERVER_ADDRESS 覆盖为 0.0.0.0。
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  datasource:
    # MySQL 地址由生产环境 DB_HOST/DB_PORT 注入，默认值仅用于本地开发。
    # characterEncoding 需为 Java 字符集名 UTF-8（Connector/J 8 会自动与服务器协商为 utf8mb4）。
    url: jdbc:mysql://${DB_HOST:192.168.31.90}:${DB_PORT:3306}/league_akari?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:chen9911.}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

team:
  # 车队名：周报标题与分享图展示用，按车队喜好自行修改
  name: "iKun"
  # 车队成员名单（"昵称#tag"）：周报/榜单的统计口径中心，增删成员改这里即可；
  # 名单在首次使用时经 Riot API 解析为 puuid（命中 riot_account 缓存表则零 API 消耗）。
  # ⚠️ 请按实际车队成员维护此名单，成员改名时更新为最新 "昵称#tag"
  roster:
    - "赌书消得泼茶香#iKun"
    - "南風知吾意#iKun"
    - "手裂鬼子#tw2"
    - "玉舍奴#tw2"
    - "達摩克裡斯之劍#tw2"
  # 车队对局判定阈值：同局出现 ≥N 名车队成员才算"开黑局"（周报/榜单只统计开黑局）
  min-shared-members: 2

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

logging:
  level:
    com.leagueakari: info
  # 文件日志通道：容器内写入 /var/log/league-akari，由 compose 挂载到宿主机持久化；
  # 本地开发可用 LOG_FILE 环境变量覆盖路径（Windows 下默认路径会落到当前盘符）
  file:
    name: ${LOG_FILE:/var/log/league-akari/app.log}
  # 轮转策略：单文件 20MB，保留 15 天，总量上限 500MB，超限自动清理最旧归档
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 15
      total-size-cap: 500MB

riot:
  # 拳头开发者 API Key（Riot Developer Portal 申请），支持环境变量 RIOT_API_KEY 覆盖；
  # 为空时召唤师搜索接口返回明确错误，其余功能不受影响
  api-key: ${RIOT_API_KEY:}
  # Riot 亚洲区 API 域名（台服账号走 asia 区）
  account-domain: https://asia.api.riotgames.com
  # 台服召唤师接口域名（Summoner-V4 按平台路由）
  summoner-domain: https://sea.api.riotgames.com
  # MATCH-V5 历史对局接口域名（台服对局走 sea 路由，用于历史回填）
  match-domain: ${RIOT_MATCH_DOMAIN:https://sea.api.riotgames.com}
  # 回填对局的 region 标记（记录到 match.region）
  match-region: ${RIOT_MATCH_REGION:TW2}
  # 历史回填：每页对局 ID 数（Riot 上限 100）与单成员最大回填局数（防失控）
  backfill-page-size: ${RIOT_BACKFILL_PAGE_SIZE:100}
  backfill-max-matches: ${RIOT_BACKFILL_MAX_MATCHES:200}

ai:
  # AI 网关的 API（OpenAI 兼容 chat/completions）
  base-url: https://yt.19851117.xyz/v1
  # API Key（环境变量 AI_API_KEY 可覆盖；为空时分析接口返回明确错误）
  api-key: ${AI_API_KEY:}
  # 分析模型（单局 AI 分析与周报锐评共用，决策见 docs/adr/0004）：
  # 曾用 mimo-v2.5 / deepseek-v4-flash，现切至 gemini-2.5-flash
  model: gemini-2.5-flash
  # 是否开启模型思考模式（开启）：
  # 开启 → 模型先输出长思维链再出正文，整流约 90s，分析更细致、英雄识别更准；
  # 关闭 → 直接输出正文，整流约 25s（实测快 3.6 倍），配合提示词英雄 ID 映射保证识别准确。
  # 三个 AI 场景（单局分析/周报锐评/局后锐评）统一读此键，无任何硬编码旁路
  thinking: true
  # 调用失败后的重试次数（不含首次，0 = 不重试）：
  # 非流式场景对"空正文"（推理模型把预算耗在思维链、finish_reason=length）自动重试；
  # 流式场景（单局分析）在尚未向客户端推送任何增量前失败时按此次数重试。
  # 3 = 每次生成最多调用 4 次，实测基本消除周报/局后锐评的空正文问题；
  # 注意流式重试会拉长单局分析的最坏等待时间（每次尝试最长受 emitter 超时约束）
  retry-count: 3
  # 采样参数：抑制长文本重复输出（温度降随机性、频率惩罚抑制循环、存在惩罚减少车轱辘话）
  temperature: 1.0
  frequency-penalty: 0.6
  presence-penalty: 0.3
  # 输出 token 上限（思维链与正文共享）：限制推理模式无限思考。
  # 实测 2048 时整流 90s→39s 且正文完整；4096 进一步给正文留足预算（复杂对局思维链更长，
  # 预算不足会截断正文，前端会提示"内容被截断"）
  max-tokens: 4096
  # 周锐评输出上限：推理模型偶发把预算耗在思维链导致正文为空（finish_reason=length），
  # 4096 配合服务端空正文自动重试（最多 2 次调用）基本消除该问题
  weekly-max-tokens: 4096
  # 系统提示词文件（classpath 下，可直接编辑）
  prompt-file: ai/system-prompt.md
  # 周报锐评提示词文件（classpath 下，可直接编辑）
  weekly-prompt-file: ai/weekly-prompt.md
  # 局后锐评提示词与输出上限（车队群视角、正文短，随局后播报发送）
  post-game-prompt-file: ai/post-game-prompt.md
  post-game-max-tokens: 2048
  # 局后锐评独立模型：播报对延迟敏感，锐评走 thinking=false 直出正文的模型（首 token ~1s）。
  # 独立键保留：将来 ai.model 换慢推理模型时局后播报不受影响（历史教训：mimo-v2.5 无视
  # thinking=false 仍先推理 ~60s，实测差 20 倍——正是当初拆分出该键的原因）
  post-game-model: gemini-2.5-flash

push:
  # 局后播报（Post-Game Broadcast）：开黑局结束后自动向车队群推送战报
  # （QQ 官方开放平台机器人通道，决策见 docs/adr/0003；默认关闭，配置齐备后打开）
  enabled: ${PUSH_ENABLED:false}
  # 车队群 openid（官方平台下发的群标识，非群号）：机器人入群后从 GROUP_ADD_ROBOT
  # 事件日志取得后填入（T5 WS 事件通道上线后日志自动给出）
  group-open-id: ${PUSH_GROUP_OPEN_ID:}
  # 机器人凭证（q.qq.com 应用管理）
  app-id: ${QQ_BOT_APP_ID:}
  client-secret: ${QQ_BOT_CLIENT_SECRET:}
  # 判定时间窗（分钟）：落库时刻距估算的对局结束时刻（game_creation + game_duration*1000）
  # 超过该窗口视为旧局（backfill/补推历史），不播报
  recent-window-minutes: 30
  # 局后锐评开关：false = 只发战报图（不调 AI、不发缺席提示）
  ai-comment-enabled: ${PUSH_AI_COMMENT_ENABLED:true}

scoring:
  # 评分算法版本号：落库时写入 match_mvp.scoring_version，查询时版本不匹配会实时重算
  # v3：MVP/ACE 评选改按 op_score 取（含多杀加分，与界面展示评分一致）
  # v4：启用基线分累积（对局首存时累加 scoring_baseline，样本 10~30 局间混合比线性过渡，上限 0.5）
  version: 4
  # 职业差异化权重表（每行和为 1.0）：按英雄职业区分各维度权重，直接改这里即可微调
  weights:
    ADC:
      kda: 0.35
      damage: 0.30
      gold: 0.10
      tank: 0.05
      vision: 0.0
      healShield: 0.0
      cc: 0.05
      turret: 0.15
    MAGE:
      kda: 0.30
      damage: 0.35
      gold: 0.10
      tank: 0.05
      vision: 0.0
      healShield: 0.0
      cc: 0.10
      turret: 0.10
    TANK:
      kda: 0.20
      damage: 0.05
      gold: 0.10
      tank: 0.40
      vision: 0.0
      healShield: 0.05
      cc: 0.15
      turret: 0.05
    ASSASSIN:
      kda: 0.40
      damage: 0.25
      gold: 0.10
      tank: 0.05
      vision: 0.0
      healShield: 0.0
      cc: 0.10
      turret: 0.10
    FIGHTER:
      kda: 0.25
      damage: 0.20
      gold: 0.10
      tank: 0.25
      vision: 0.0
      healShield: 0.05
      cc: 0.10
      turret: 0.05
    SUPPORT:
      kda: 0.20
      damage: 0.0
      gold: 0.05
      tank: 0.05
      vision: 0.0
      healShield: 0.40
      cc: 0.25
      turret: 0.05
    UNKNOWN:
      kda: 0.30
      damage: 0.25
      gold: 0.10
      tank: 0.15
      vision: 0.0
      healShield: 0.05
      cc: 0.10
      turret: 0.05
  # 多杀加分：直接加到 OP Score 上（clamp 到 0-10）
  multi-kill-bonus:
    double: 0.2
    triple: 0.5
    quadra: 1.0
    penta: 2.0
  # 基线混合比阈值（按英雄独立统计）：
  # 样本量 < baseline-threshold-min → 纯局内比较；之间线性过渡；≥ max → 锁定 baseline-mix-max
  baseline-threshold-min: 10
  baseline-threshold-max: 30
  baseline-mix-max: 0.5
