server:
  port: 8081
  # 仅监听本机回环地址：本应用为个人本机自用后端，收窄网络暴露面，防止局域网内任意访问
  address: 127.0.0.1

spring:
  datasource:
    # MySQL 位于虚拟机 192.168.31.90:3306；createDatabaseIfNotExist 自动建库，allowPublicKeyRetrieval 兼容 caching_sha2_password
    # characterEncoding 需为 Java 字符集名 UTF-8（Connector/J 8 会自动与服务器协商为 utf8mb4），utf8mb4 不是合法 Java charset 名
    url: jdbc:mysql://192.168.31.90:3306/league_akari?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:chen9911.}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

logging:
  level:
    com.leagueakari: info

riot:
  # 拳头开发者 API Key（Riot Developer Portal 申请），支持环境变量 RIOT_API_KEY 覆盖；
  # 为空时召唤师搜索接口返回明确错误，其余功能不受影响
  api-key: ${RIOT_API_KEY:}
  # Riot 亚洲区 API 域名（台服账号走 asia 区）
  account-domain: https://asia.api.riotgames.com
  # 台服召唤师接口域名（Summoner-V4 按平台路由）
  summoner-domain: https://sea.api.riotgames.com

ai:
  # opencode go 的 API（OpenAI 兼容 chat/completions）
  base-url: https://opencode.ai/zen/go/v1
  # API Key（环境变量 AI_API_KEY 可覆盖；为空时分析接口返回明确错误）
  api-key: ${AI_API_KEY:}
  # 分析模型：deepseek-v4-flash
  model: mimo-v2.5
  # 是否开启模型思考模式（开启）：
  # 开启 → 模型先输出长思维链再出正文，整流约 90s，分析更细致、英雄识别更准；
  # 关闭 → 直接输出正文，整流约 25s（实测快 3.6 倍），配合提示词英雄 ID 映射保证识别准确
  thinking: false
  # 采样参数：抑制长文本重复输出（温度降随机性、频率惩罚抑制循环、存在惩罚减少车轱辘话）
  temperature: 1.0
  frequency-penalty: 0.6
  presence-penalty: 0.3
  # 输出 token 上限（思维链与正文共享）：限制推理模式无限思考。
  # 实测 2048 时整流 90s→39s 且正文完整；3072 进一步给正文留足预算（复杂对局思维链更长，
  # 预算不足会截断正文，前端会提示"内容被截断"）
  max-tokens: 3072
  # 系统提示词文件（classpath 下，可直接编辑）
  prompt-file: ai/system-prompt.md
