server:
  port: 8081
  # 仅监听本机回环地址：本应用为个人本机自用后端，收窄网络暴露面，防止局域网内任意访问
  address: 127.0.0.1

spring:
  datasource:
    # MySQL 位于虚拟机 192.168.31.90:3306；createDatabaseIfNotExist 自动建库，allowPublicKeyRetrieval 兼容 caching_sha2_password
    # characterEncoding 需为 Java 字符集名 UTF-8（Connector/J 8 会自动与服务器协商为 utf8mb4），utf8mb4 不是合法 Java charset 名
    url: jdbc:mysql://192.168.31.90:3306/league_akari?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:chen9911.}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

logging:
  level:
    com.leagueakari: info

riot:
  # 拳头开发者 API Key（Riot Developer Portal 申请），支持环境变量 RIOT_API_KEY 覆盖；
  # 为空时召唤师搜索接口返回明确错误，其余功能不受影响
  api-key: ${RIOT_API_KEY:}
  # Riot 亚洲区 API 域名（台服账号走 asia 区）
  account-domain: https://asia.api.riotgames.com
  # 台服召唤师接口域名（Summoner-V4 按平台路由）
  summoner-domain: https://sea.api.riotgames.com
